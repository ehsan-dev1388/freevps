name: Ubuntu Cloud Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Update Ubuntu & Install SSH
      # ============================================================
      - name: 1. Setup Ubuntu SSH Server
        run: |
          echo "Updating packages..."
          sudo apt-get update -y

          echo "Installing OpenSSH..."
          sudo apt-get install -y openssh-server curl

          echo "Starting SSH service..."
          sudo systemctl enable ssh
          sudo systemctl restart ssh

          echo "SSH status:"
          sudo systemctl status ssh --no-pager || true


      # ============================================================
      # 2. Create Admin User
      # ============================================================
      - name: 2. Create Admin Account
        run: |
          USERNAME="NvDAdmin"
          PASSWORD='P@ssw0rd1qazXSW@#'

          if id "$USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            sudo useradd -m -s /bin/bash "$USERNAME"
          fi

          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          # Add user to sudo group
          sudo usermod -aG sudo "$USERNAME"

          # Allow sudo without password
          echo "$USERNAME ALL=(ALL) NOPASSWD:ALL" | sudo tee \
            "/etc/sudoers.d/$USERNAME" > /dev/null

          sudo chmod 440 "/etc/sudoers.d/$USERNAME"

          echo ""
          echo "=================================================="
          echo " Ubuntu Admin Account Created"
          echo " Username : $USERNAME"
          echo " Password : $PASSWORD"
          echo "=================================================="


      # ============================================================
      # 3. Install & Connect Tailscale
      # ============================================================
      - name: 3. Install & Connect Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |
          echo "Installing Tailscale..."

          curl -fsSL https://tailscale.com/install.sh | sh

          echo "Connecting to Tailscale..."

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-ubuntu-server"

          sleep 8

          echo ""
          echo "=================================================="
          echo "        UBUNTU SERVER IS READY!"
          echo "=================================================="

          TS_IP=$(sudo tailscale ip -4)

          echo "Tailscale IP : $TS_IP"
          echo "Username     : NvDAdmin"
          echo "Password     : P@ssw0rd1qazXSW@#"

          echo ""
          echo "SSH COMMAND:"
          echo "ssh NvDAdmin@$TS_IP"

          echo "=================================================="


      # ============================================================
      # 4. Show System Information
      # ============================================================
      - name: 4. Server Information
        run: |
          echo ""
          echo "================ SERVER INFO ================"

          echo "OS:"
          lsb_release -a 2>/dev/null || cat /etc/os-release

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "RAM:"
          free -h

          echo ""
          echo "Disk:"
          df -h /

          echo ""
          echo "Tailscale:"
          sudo tailscale status

          echo ""
          echo "SSH:"
          sudo systemctl status ssh --no-pager || true

          echo "=============================================="


      # ============================================================
      # 5. Keep Server Alive
      # ============================================================
      - name: 5. Keep Server Alive
        run: |
          for i in $(seq 1 360); do
            echo "[$i/360] Ubuntu server running..."
            sleep 60
          done
